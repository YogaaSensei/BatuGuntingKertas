<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="papan-score">
            <p>You: <span id="player-score">0</span></p>
            <p>Computer: <span id="komputer-score">0</span></p>
        </div>
        
        <div class="result-box">
            <p id="player-choice">Your choice:</p>
            <p id="komputer-choice">Computer choice:</p>
            <h2 id="game-result">Let's Play!</h2>
        </div>

        <div class="list-choice">
            <button class="choice-btn" data-choice="Rock">✊</button>
            <button class="choice-btn" data-choice="Scissors">✌️</button>
            <button class="choice-btn" data-choice="Paper">✋</button>
        </div>

        <button id="reset-btn">Reset Game</button>
    </div>

   <script src="./js/script.js"></script>
</body>
</html>
