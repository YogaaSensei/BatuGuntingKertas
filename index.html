<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Batu Gunting Kertas</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Batu Gunting Kertas</h1>
        <div class="papan-score">
            <p>Kamu: <span id="player-score">0</span></p>
            <p>Komputer: <span id="komputer-score">0</span></p>
        </div>
        
        <div class="result-box">
            <p id="player-choice">Pilihan mu:</p>
            <p id="komputer-choice">Pilihan komputer:</p>
            <h2 id="game-result">Ayo main!</h2>
        </div>

        <div class="list-choice">
            <button class="choice-btn" data-choice="Batu">✊</button>
            <button class="choice-btn" data-choice="Gunting">✌️</button>
            <button class="choice-btn" data-choice="kertas">✋</button>
        </div>

        <button id="reset-btn">Reset Permainan</button>
    </div>

   <script src="./js/script.js"></script>
</body>
</html>
